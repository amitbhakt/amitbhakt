name: Build Profile README

# Rebuilds the live sections of README.md, the SVGs in assets/ and contributions.md,
# and commits them if anything changed.
on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *' # Every 6 hours

permissions:
  contents: write

concurrency:
  group: build-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild README & Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_readme.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898275+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update profile README, waveform and contributions [skip ci]"
          git push
